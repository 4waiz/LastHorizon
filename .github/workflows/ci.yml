name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The long layers are too slow for every push and too valuable to run only
  # before a release. Nightly is the compromise, and `workflow_dispatch` is
  # how you run them on demand when a change looks like it might drift.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # The static half of the release gate. Fast enough to block every PR.
  # ---------------------------------------------------------------------------
  verify:
    name: Static gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `vite.config.ts` derives `__LH_BUILD__` from the commit sha, and a
          # shallow clone still has HEAD, but a full history makes the id
          # meaningful when comparing two runs.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` and nothing else. It installs exactly the lockfile and fails
      # if package.json and the lock disagree, which is the property that makes
      # a cached dependency install safe to trust.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Budget gate
        run: npm run check:budgets

      # Every emitted chunk must be deliberately eager or deliberately lazy.
      # Five consecutive phases shipped a lazy chunk counted as startup weight,
      # and the symptom was always somebody else's commit going over budget.
      - name: Chunk classification
        run: npm run check:chunks

      - name: Story content gate
        run: npm run check:story

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

      # The two reports a reviewer actually wants when a budget moves.
      - name: Bundle report
        if: always()
        run: |
          {
            echo '## Bundle'
            echo '```'
            npm run --silent check:budgets || true
            echo '```'
            echo '## Chunks'
            echo '```'
            npm run --silent check:chunks || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Functional browser coverage, across the three engines.
  #
  # Sharded since Phase 9: at 111 scenarios a single serial run crashed the
  # browser process at the tail (`Target crashed`, exit 0xC0000409), and a
  # retry cannot help because the thing that died is what the retry would run
  # in. Each shard is a fresh runner with a fresh browser.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (${{ matrix.browser }} ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build
        run: npm run build

      # WebGL under headless CI is SwiftShader software rendering, so nothing
      # here may assume hardware — see the note in tests/long/perf.spec.ts.
      - name: End-to-end tests
        run: npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Visual regression. Chromium only: a screenshot baseline is per-renderer,
  # and three engines means three sets of antialiasing differences to maintain
  # for one question — "did the scene change".
  # ---------------------------------------------------------------------------
  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Visual tests
        run: npm run test:visual

      # The diffs are the whole point of this job when it fails: a reviewer
      # needs to see *what* moved, not that something did.
      - name: Upload screenshots and diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Soak and performance. Nightly, on demand, and before a release — not on
  # every PR, because ~15 minutes on every push is a gate people learn to
  # ignore. docs/RELEASE_CHECKLIST.md records that trade explicitly.
  # ---------------------------------------------------------------------------
  long:
    name: Soak and performance
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      - name: Performance
        run: npm run test:perf

      - name: Soak
        run: npm run test:soak

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: |
            perf-report/
            playwright-report/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # One job for branch protection to require, so "the gates passed" is a single
  # check rather than a list somebody has to keep in step with the matrix.
  #
  # `always()` plus an explicit result test: without it, a *skipped* dependency
  # counts as success, and a cancelled matrix leg would let a merge through.
  # ---------------------------------------------------------------------------
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    needs: [verify, e2e, visual]
    if: always()
    steps:
      - name: Require every gate to have passed
        run: |
          echo "verify: ${{ needs.verify.result }}"
          echo "e2e:    ${{ needs.e2e.result }}"
          echo "visual: ${{ needs.visual.result }}"
          if [ "${{ needs.verify.result }}" != "success" ] \
          || [ "${{ needs.e2e.result }}" != "success" ] \
          || [ "${{ needs.visual.result }}" != "success" ]; then
            echo "::error::A release gate did not pass. Merging is blocked."
            exit 1
          fi
          echo "All release gates passed."
