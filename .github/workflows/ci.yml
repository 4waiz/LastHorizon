name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, unit tests, build, budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Budget gate
        run: npm run check:budgets

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Sharded from Phase 9 onward.
  #
  # The suite is 111 scenarios, each booting a real WebGL context, and it runs
  # serially because those contexts are expensive. At Phase 8 that was a ~20
  # minute run; Phase 9's combat scenarios pushed it to ~24, and at that length
  # the browser process started dying at the tail — `Target crashed`, exit
  # 0xC0000409, in whichever file happened to run last. Every one of those
  # tests passes when its file is run on its own.
  #
  # `playwright.config.ts` has said since Phase 6 that "a run of this size
  # needs splitting rather than tolerating". This is that split. Each shard is
  # a fresh runner with a fresh browser, so nothing accumulates across half a
  # suite, and the wall clock halves as a side effect.
  e2e:
    name: Playwright smoke (${{ matrix.browser }} ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build
        run: npm run build

      # WebGL needs a GPU-ish surface; SwiftShader software rendering is what
      # headless CI actually has, so the run must not assume hardware.
      - name: Smoke tests
        run: npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
